name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: CLI smoke checks
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI"
          git checkout -q -b main
          echo "seed" > seed.txt
          git add seed.txt
          git commit -qm "init"

          debugbrief --help

          # doctor: warnings (exit 1) are acceptable in a fresh repo;
          # only blocking issues (exit 2) should fail the smoke check.
          rc=0
          debugbrief doctor || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "doctor reported blocking issues (exit $rc)"
            exit 1
          fi

          debugbrief start "ci smoke"
          debugbrief note "ci note"
          debugbrief run "python -c 'print(1)'"
          debugbrief end --mode pr
          debugbrief last
          debugbrief list
