name: Release

# Builds the tagged source and publishes through the existing PyPI project's
# GitHub Trusted Publisher for this repository, release.yml and environment pypi.
# No long-lived publishing token is stored in the repository.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify the release tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project_version=$(python -c '
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          ')
          if [ "$tag" != "$project_version" ]; then
            echo "Release tag '$tag' does not match pyproject version '$project_version'." >&2
            echo "Update the version in pyproject.toml or retag the release, then try again." >&2
            exit 1
          fi
          echo "Release tag matches package version: $project_version"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/debugbrief/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
