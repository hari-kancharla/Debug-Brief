name: Release

# Publishes to PyPI using Trusted Publishing (OIDC), so no API token is stored.
# Runs only when a GitHub Release is published, and builds from that release's
# tagged commit. Configure the trusted publisher once on PyPI:
# https://docs.pypi.org/trusted-publishers/

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the release tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project_version=$(python -c '
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          ')
          if [ "$tag" != "$project_version" ]; then
            echo "Release tag '$tag' does not match pyproject version '$project_version'." >&2
            echo "Update the version in pyproject.toml or retag the release, then try again." >&2
            exit 1
          fi
          echo "Release tag matches package version: $project_version"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
