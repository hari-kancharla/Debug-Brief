name: Website checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install verification tools
        run: |
          python -m pip install -e '.[dev]'
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify site links and generated fixtures
        run: |
          python scripts/check_site.py
          python scripts/generate_samples.py --check
          python -m pytest -q tests/test_site.py
      - name: Test browser interactions, imports, accessibility and reflow
        run: npm run test:site
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-verification
          path: |
            artifacts/verification/
            test-results/
          retention-days: 7
